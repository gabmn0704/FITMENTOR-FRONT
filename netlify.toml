[build]
  command = "npm run build"
  publish = "dist"

# Variables de entorno (VITE_API_URL, VITE_GOOGLE_CLIENT_ID) se definen en
# Netlify: Site configuration > Environment variables. No hay URLs fijas aquí.
[build.environment]
  NODE_VERSION = "22"

# Cabeceras de seguridad. Netlify no interpola variables de entorno en estas
# cabeceras, así que connect-src permite https: y wss: para que cualquier
# backend configurado en VITE_API_URL funcione sin editar este archivo.
# Orígenes concretos usados por la app:
#   - accounts.google.com: Google Identity Services (script, iframes y API).
#   - cdn.jsdelivr.net: wasm y runtime de MediaPipe (versión fijada en el código).
#   - storage.googleapis.com: modelo de pose de MediaPipe.
#   - fonts.googleapis.com / fonts.gstatic.com: tipografías.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https: wss: https://accounts.google.com https://storage.googleapis.com https://cdn.jsdelivr.net; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
